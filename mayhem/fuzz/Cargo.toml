[package]
name = "dhall-rust-mayhem-fuzz"
version = "0.0.0"
edition = "2018"
publish = false

# Standalone crate under mayhem/ — MUST declare its own empty [workspace] table or
# cargo errors that it "believes it's in a workspace when it's not" against the
# upstream root Cargo.toml (which lists dhall/dhall_proc_macros/serde_dhall as
# members and must never be edited). This crate is intentionally NOT a member of
# that workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# reqwest (imports over HTTP) is a *default* feature of the upstream `dhall` crate.
# Both fuzz targets below only ever call `skip_resolve`, which errors out on any
# Import node instead of fetching it — so no network code path is reachable — but
# building with `default-features = false` also drops reqwest/native-tls/tokio from
# the dependency graph entirely, which keeps the sanitized build fast and avoids an
# OpenSSL-under-ASan linking headache for no behavioural difference.
[dependencies.dhall]
path = "../../dhall"
default-features = false

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_typecheck"
path = "fuzz_targets/fuzz_typecheck.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
